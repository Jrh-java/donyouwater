<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 水库背景 -->
  <circle cx="100" cy="100" r="90" fill="#1976d2" />
  
  <!-- 水波纹 -->
  <path d="M30,120 C50,100 70,140 100,120 C130,100 150,140 170,120 L170,170 L30,170 Z" fill="#64b5f6" opacity="0.8" />
  <path d="M30,130 C50,110 70,150 100,130 C130,110 150,150 170,130 L170,170 L30,170 Z" fill="#bbdefb" opacity="0.6" />
  
  <!-- 大坝 -->
  <rect x="40" y="70" width="120" height="10" fill="#455a64" />
  <rect x="50" y="50" width="100" height="20" fill="#607d8b" />
  
  <!-- 山峰 -->
  <polygon points="20,70 60,30 100,60 140,20 180,70" fill="#4caf50" opacity="0.7" />
  
  <!-- 文字图标 -->
  <text x="100" y="110" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">智慧水库</text>
</svg>